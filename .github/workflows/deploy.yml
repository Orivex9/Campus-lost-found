name: Build and deploy Campus Lost and Found
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64
      - name: Compile C to WebAssembly
        run: emcc main.c -O2 -s WASM=1 -s MODULARIZE=0 -s EXPORT_NAME=Module -s EXPORTED_FUNCTIONS='["_add_item","_get_item_count","_get_item_field","_clear_items","_malloc","_free"]' -s EXPORTED_RUNTIME_METHODS='["stringToNewUTF8"]' -s ALLOW_MEMORY_GROWTH=1 -o c-core.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
